rules:
  # 局域网与私有网络直连 (GEOSITE 与 GEOIP 完整覆盖私有域名与内网 IP 段)
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 自定义直连 / 域名分流
  - DOMAIN-SUFFIX,hybgzs.com,🇨🇳 特殊直连
  - DOMAIN-SUFFIX,mob.com,DIRECT
  - DOMAIN-SUFFIX,ghfast.top,DIRECT
  - DOMAIN-SUFFIX,gh-proxy.org,DIRECT
  - DOMAIN-SUFFIX,spaceship.com,DIRECT
  - DOMAIN-SUFFIX,hidns.vip,🌏 我的网站
  - DOMAIN-SUFFIX,openapi.cfd,🌏 我的网站
  - DOMAIN-SUFFIX,zkyml.com,🌏 我的网站
  - DOMAIN-SUFFIX,945395.xyz,🌏 我的网站
  - DOMAIN-SUFFIX,bxcdn.net,REJECT

  # ==========================================
  # 广告拦截强化 (高精度本地规则 + 云端规则集)
  # ==========================================
  # 字节跳动 / 抖音 / 番茄小说 广告与穿山甲联盟
  - DOMAIN-KEYWORD,-ad-sign.byteimg.com,REJECT
  - DOMAIN-SUFFIX,pangle.io,REJECT
  - DOMAIN-SUFFIX,pangolin-sdk-toutiao.com,REJECT
  - DOMAIN-SUFFIX,pangolin-sdk-toutiao-b.com,REJECT
  - DOMAIN-SUFFIX,pglstatp-toutiao.com,REJECT
  - DOMAIN-SUFFIX,volcsirius.com,REJECT
  - DOMAIN-SUFFIX,ulogs.umeng.com,REJECT
  - DOMAIN-SUFFIX,alog.umeng.com,REJECT

  # 腾讯优量汇 / 广点通
  - DOMAIN-SUFFIX,gdt.qq.com,REJECT
  - DOMAIN-SUFFIX,e.qq.com,REJECT
  - DOMAIN-SUFFIX,mi.gdt.qq.com,REJECT
  - DOMAIN-SUFFIX,tmead.y.qq.com,REJECT

  # 快手联盟 / 百度联盟
  - DOMAIN-SUFFIX,adkwai.com,REJECT
  - DOMAIN-SUFFIX,e.kuaishou.com,REJECT
  - DOMAIN-SUFFIX,mobads.baidu.com,REJECT
  - DOMAIN-SUFFIX,cpro.baidustatic.com,REJECT

  # 云端 Rule-Providers 自动更新规则拦截
  - RULE-SET,reject_ad,REJECT

  # 基础 GEOSITE 广告库拦截
  - GEOSITE,category-ads-all,REJECT

  # ==========================================
  # 阻止 QUIC (HTTP/3)，强制走 TCP (HTTP/2) TLS，避免 UDP QoS 丢包导致外网视频卡顿
  # ==========================================
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # ==========================================
